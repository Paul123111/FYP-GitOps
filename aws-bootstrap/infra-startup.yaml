#cloud-config
package_update: true
packages:
  - git
  - curl
  - unzip
users:
  - default
  - name: ubuntu
    groups: [docker]
write_files:
  - path: /tmp/setup.sh
    permissions: '0755'
    content: |
      #!/bin/bash

      set -x

      # for argocd
      export HOME=/root
      
      ################
      # Swapfile
      ################
      # allocate 2GB swapfile for stability
      echo "Allocating swapfile..."
      fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
      echo '/swapfile none swap sw 0 0' >> /etc/fstab

      ################
      # AWS CLI
      ################
      echo "Installing AWS CLI..."
      curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
      unzip awscliv2.zip
      ./aws/install
      rm -rf awscliv2.zip aws

      ################
      # ArgoCD CLI
      ################
      echo "Installing ArgoCD CLI..."
      mkdir -p /usr/local/bin
      curl -sSL -o /usr/local/bin/argocd https://github.com/argoproj/argo-cd/releases/download/v3.3.9/argocd-linux-amd64
      chmod +x /usr/local/bin/argocd

      ################
      # Credentials
      ################
      set +x
      export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query "Account" --output text)
      set -x

      mkdir -p /var/lib/rancher/k3s/agent/etc
      cat > /var/lib/rancher/k3s/agent/etc/ecr-config.yaml <<EOF
      apiVersion: kubelet.config.k8s.io/v1
      kind: CredentialProviderConfig
      providers:
        - name: ecr-credential-provider
          matchImages:
            - "*.dkr.ecr.eu-west-1.amazonaws.com"
          defaultCacheDuration: "12h"
          apiVersion: credentialprovider.kubelet.k8s.io/v1
      EOF

      apt-get update 
      apt-get install -y amazon-ecr-credential-helper
      apt-get install -y socat

      mkdir -p /usr/local/bin/kubelet-plugins/

      curl -Lo /usr/local/bin/kubelet-plugins/ecr-credential-provider \
        https://github.com/dntosas/ecr-credential-provider/releases/download/v1.2.0/ecr-credential-provider-linux-amd64
      chmod +x /usr/local/bin/kubelet-plugins/ecr-credential-provider
      chmod 755 /usr/local/bin/kubelet-plugins

      ################
      # K3s Install
      ################
      set +x
      echo "Installing k3s..."
      NODE_NAME="$(hostname)-infra"
      MY_TOKEN=$(openssl rand -base64 32)
      sleep 5
      curl -sfL https://get.k3s.io | K3S_TOKEN="$MY_TOKEN" INSTALL_K3S_EXEC="server" sh -s - \
        --node-name="$NODE_NAME" \
        --docker \
        --kubelet-arg="image-credential-provider-bin-dir=/usr/local/bin/kubelet-plugins" \
        --kubelet-arg="image-credential-provider-config=/var/lib/rancher/k3s/agent/etc/ecr-config.yaml"

      export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
      set -x
      
      echo "Waiting for K3s..."
      until kubectl get node "$NODE_NAME" &>/dev/null; do
        echo "Node $NODE_NAME not found yet. Retrying in 5s..."
        sleep 5
      done
      kubectl label node "$NODE_NAME" node-role.kubernetes.io/infra=true
      kubectl label node "$NODE_NAME" node-type=infra
      
      ################
      # Secrets
      ################
      set +x
      SSM_TOKEN=$(sudo cat /var/lib/rancher/k3s/server/node-token | tr -d '\n' | tr -d '\r')
      aws ssm put-parameter --name "/k3s/fyp-token" --value "$SSM_TOKEN" --type "SecureString" --overwrite

      CRT_VAL=$(aws ssm get-parameter --name "/k3s/cloudflare-cert" --with-decryption --query "Parameter.Value" --output text | base64 -w 0)
      KEY_VAL=$(aws ssm get-parameter --name "/k3s/cloudflare-cert-key" --with-decryption --query "Parameter.Value" --output text | base64 -w 0)

      kubectl apply -f - <<EOF
      ---
      apiVersion: v1
      kind: Namespace
      metadata:
        name: server-api-system
      ---
      apiVersion: v1
      kind: Secret
      metadata:
        name: cloudflare-origin-cert
        namespace: server-api-system
      type: kubernetes.io/tls
      data:
        tls.crt: $CRT_VAL
        tls.key: $KEY_VAL
      EOF

      unset CRT_VAL KEY_VAL
      set -x

      ################
      # ArgoCD
      ################
      echo "Installing ArgoCD..."
      kubectl create namespace argocd
      kubectl apply -n argocd --server-side --force-conflicts -f https://raw.githubusercontent.com/argoproj/argo-cd/v3.3.9/manifests/install.yaml
      
      echo "Waiting for Argo CD CRDs..."
      kubectl wait --for=condition=established --timeout=60s crd/applications.argoproj.io
      
      ################
      # Get repo
      ################
      set +x
      GITHUB_TOKEN=$(aws ssm get-parameter --name "/github/fyp-token" --with-decryption --query "Parameter.Value" --output text)
      echo "Downloading root-app.yaml from repo..."
      curl -L -H "Accept: application/vnd.github.v3.raw" \
        -H "Authorization: Bearer $GITHUB_TOKEN" \
        -H "X-GitHub-Api-Version: 2026-03-10" \
        https://api.github.com/repos/Paul123111/FYP-GitOps/contents/bootstrap/root-app.yaml \
        -o /tmp/root-app.yaml

      # swapping out awsId in root-app for AWS Account ID
      sed -i "s/123456789012/$AWS_ACCOUNT_ID/g" /tmp/root-app.yaml
      
      cat <<EOF | kubectl apply -f -
      apiVersion: v1
      kind: Secret
      metadata:
        name: fyp-repo-creds
        namespace: argocd
        labels:
          argocd.argoproj.io/secret-type: repository
      stringData:
        type: git
        url: https://github.com/Paul123111/FYP-GitOps.git
        username: Paul123111
        password: $GITHUB_TOKEN
      EOF
      unset GITHUB_TOKEN
      unset AWS_ACCOUNT_ID
      set -x

      echo "Deploying root-app in ArgoCD..."
      kubectl apply -f /tmp/root-app.yaml

runcmd:
  - bash /tmp/setup.sh

