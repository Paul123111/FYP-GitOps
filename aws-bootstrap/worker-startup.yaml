#cloud-config
package_update: true
packages:
  - git
  - curl
  - unzip
users:
  - default
  - name: ubuntu
    groups: [docker]
write_files:
  - path: /tmp/setup.sh
    permissions: '0755'
    content: |
      #!/bin/bash

      set -x
      
      ################
      echo "Installing AWS CLI..."
      curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
      unzip awscliv2.zip
      ./aws/install
      rm -rf awscliv2.zip aws

      ################
      set +x
      export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query "Account" --output text)
      set -x
      
      mkdir -p /var/lib/rancher/k3s/agent/etc
      cat > /var/lib/rancher/k3s/agent/etc/ecr-config.yaml <<EOF
      apiVersion: kubelet.config.k8s.io/v1
      kind: CredentialProviderConfig
      providers:
        - name: ecr-credential-provider
          matchImages:
            - "*.dkr.ecr.eu-west-1.amazonaws.com"
          defaultCacheDuration: "12h"
          apiVersion: credentialprovider.kubelet.k8s.io/v1
      EOF

      apt-get update 
      apt-get install -y amazon-ecr-credential-helper

      mkdir -p /usr/local/bin/kubelet-plugins/

      curl -Lo /usr/local/bin/kubelet-plugins/ecr-credential-provider \
        https://github.com/dntosas/ecr-credential-provider/releases/download/v1.2.0/ecr-credential-provider-linux-amd64
      chmod +x /usr/local/bin/kubelet-plugins/ecr-credential-provider
      chmod 755 /usr/local/bin/kubelet-plugins

      ################
      echo "Installing k3s..."
      NODE_NAME="$(hostname)-worker"
      # RAW_SSM_TOKEN="$(aws ssm get-parameter --name "/k3s/fyp-token" --with-decryption --query "Parameter.Value" --output text)"
      # export K3S_TOKEN="$(echo "$RAW_SSM_TOKEN" | tr -d '[:space:]')"
      export K3S_TOKEN="$(aws ssm get-parameter --name "/k3s/fyp-token" --with-decryption --query "Parameter.Value" --output text)"

      MASTER_IP=$(aws ec2 describe-instances \
        --filters "Name=tag:Name,Values=infra-node" "Name=instance-state-name,Values=running" \
        --query "Reservations[*].Instances[*].PrivateIpAddress" \
        --output text)

      echo "$MASTER_IP"
      if [[ -z "$MASTER_IP" ]]; then
        echo "Error: infra-node not found"
        exit 1
      fi

      TOKEN=$(curl -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 21600")
      PUBLIC_IP=$(curl -H "X-aws-ec2-metadata-token: $TOKEN" -v http://169.254.169.254/latest/meta-data/public-ipv4)

      curl -sfL https://get.k3s.io | K3S_URL="https://${MASTER_IP}:6443" INSTALL_K3S_EXEC="agent" sh -s - \
        --node-name="$NODE_NAME" \
        --docker \
        --node-label="node-type=workers" \
        --node-external-ip="$PUBLIC_IP" \
        --kubelet-arg="image-credential-provider-bin-dir=/usr/local/bin/kubelet-plugins" \
        --kubelet-arg="image-credential-provider-config=/var/lib/rancher/k3s/agent/etc/ecr-config.yaml"
      export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

      unset K3S_TOKEN
      set -x
      
      echo "Waiting for K3s..."
      until kubectl get node "$NODE_NAME" &>/dev/null; do
        echo "Node $NODE_NAME not found yet. Retrying in 5s..."
        sleep 5
      done
      # kubectl label node "$NODE_NAME" node-role.kubernetes.io/workers=true
      # kubectl label node "$NODE_NAME" node-type=workers

      set -x

runcmd:
  - bash /tmp/setup.sh

