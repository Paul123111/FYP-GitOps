apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agones
  namespace: argocd
spec:
  project: default
  source:
    chart: agones
    repoURL: https://agones.dev
    targetRevision: 1.34.0
    helm:
      values: |
        agones:
          allocator:
            service:
              type: NodePort
          controller:
            apiServer:
              insecure: true
  destination:
    server: https://default.svc
    namespace: agones-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

