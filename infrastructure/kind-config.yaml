kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
- role: worker
  extraPortMappings:
  # Map host ports 7000-7010 to the worker node for UDP game traffic
  - containerPort: 7000
    hostPort: 7000
    protocol: UDP
  - containerPort: 7001
    hostPort: 7001
    protocol: UDP
  - containerPort: 7002
    hostPort: 7002
    protocol: UDP
  - containerPort: 7003
    hostPort: 7003
    protocol: UDP
  - containerPort: 7004
    hostPort: 7004
    protocol: UDP
  - containerPort: 7005
    hostPort: 7005
    protocol: UDP
  - containerPort: 7006
    hostPort: 7006
    protocol: UDP
  - containerPort: 7007
    hostPort: 7007
    protocol: UDP
  - containerPort: 7008
    hostPort: 7008
    protocol: UDP
  - containerPort: 7009
    hostPort: 7009
    protocol: UDP
  - containerPort: 7010
    hostPort: 7010
    protocol: UDP
- role: worker

