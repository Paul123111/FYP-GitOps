---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fleet-app
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/Paul123111/FYP-GitOps.git
    targetRevision: HEAD
    path: game
    helm:
      parameters:
        - name: "awsId"
          value: "placeholder"
  destination:
    server: "https://kubernetes.default.svc"
    namespace: default
  ignoreDifferences:
  - group: agones.dev
    kind: Fleet
    jsonPointers:
    - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
