---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Paul123111/FYP-GitOps.git
    targetRevision: main
    path: bootstrap/apps
    helm:
      parameters:
        - name: "awsId"
          value: "123456789012"
  destination:
    server: "https://kubernetes.default.svc"
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
