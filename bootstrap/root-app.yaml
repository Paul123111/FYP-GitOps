---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Paul123111/FYP-Gitops.git
    targetRevision: HEAD
    path: bootstrap/apps
  destination:
    server: "https://kubernetes.default.svc"
    namespace: argocd
  helm:
    parameters:
      - name: "fleet-app.awsId"
        value: "123456789012"
      - name: "api-app.awsId"
        value: "123456789012"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
