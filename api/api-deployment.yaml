---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server-api
  namespace: server-api-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: server-api
  template:
    metadata:
      labels:
        app: server-api
    spec:
      serviceAccountName: server-api-sa
      containers:
      - name: api
        image: 192.168.1.17:5000/planet-hunter-api:0.1
        ports:
        - containerPort: 8080
        env:
        - name: UNITY_PROJECT_ID
          value: "b3e96b7f-8284-47ea-bec0-90e51607c3b9"
