---
apiVersion: agones.dev/v1
kind: Fleet
metadata:
  name: planet-hunter-fleet
spec:
  replicas: 3
  template:
    spec:
      health:
        initialDelaySeconds: 120
        periodSeconds: 20
        failureThreshold: 5
      ports:
        - name: default
          portPolicy: Dynamic
          containerPort: 7777
      lists:
        players:
          capacity: 4
      template:
        spec:
          nodeSelector:
            node-type: workers
          containers:
            - name: unity-simple-server
              image: {{ .Values.awsId }}.dkr.ecr.eu-west-1.amazonaws.com/planet-hunter-server:1.2
              imagePullPolicy: IfNotPresent
              resources:
                requests:
                  memory: 200Mi
                  cpu: 30m
                limits:
                  memory: 300Mi
                  cpu: 100m

